<title>Simulador Código da Estrada</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: single-column exam paper, sign-blue header band, answer rows like a printed test sheet */
:root{
  --bg:#edf1f5; --surface:#ffffff; --fg:#0c2036; --muted:#5a6b7d; --line:#cfd8e1;
  --blue:#0b4ea2; --blue-fg:#ffffff; --red:#c4122f; --green:#17784a; --amber:#b86e00;
  --fig-bg:#f4f7fa; --ok-bg:#e3f4ea; --bad-bg:#fbe5e8; --sel-bg:#e2ecf8;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1623; --surface:#13243a; --fg:#e8eef5; --muted:#93a5b8; --line:#26405c;
  --blue:#5a9bf0; --blue-fg:#07182b; --red:#ff6b7f; --green:#4cc58a; --amber:#f0a73a;
  --fig-bg:#dfe7f0; --ok-bg:#12382a; --bad-bg:#44171f; --sel-bg:#1c3a60; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1623; --surface:#13243a; --fg:#e8eef5; --muted:#93a5b8; --line:#26405c;
  --blue:#5a9bf0; --blue-fg:#07182b; --red:#ff6b7f; --green:#4cc58a; --amber:#f0a73a;
  --fig-bg:#dfe7f0; --ok-bg:#12382a; --bad-bg:#44171f; --sel-bg:#1c3a60; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:clamp(2rem,7vw,2.8rem)}
h2{font-size:1.5rem}
.top{display:flex;align-items:center;gap:12px}
.roundel{flex:none}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:.95rem;color:var(--muted);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.sheet{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:4px}
.sheet div{padding:12px;text-align:center;border-right:1px solid var(--line)}
.sheet div:last-child{border-right:0}
.sheet b{display:block;font-family:var(--display);font-size:1.9rem;line-height:1}
.sheet span{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:2px solid var(--line);background:transparent;color:var(--fg);border-radius:4px;padding:12px;text-align:left;font:inherit;cursor:pointer}
.mode b{display:block;font-family:var(--display);font-size:1.2rem}
.mode small{color:var(--muted);line-height:1.3;display:block}
.mode[aria-pressed="true"]{border-color:var(--blue);background:var(--sel-bg)}
button{font:inherit}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn{background:var(--blue);color:var(--blue-fg);border:0;border-radius:4px;padding:12px 20px;font-family:var(--display);font-size:1.2rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.timer{font-family:var(--display);font-size:1.7rem;font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--red)}
.cover{background:var(--blue);color:var(--blue-fg);border-radius:6px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:4px}
.cover .em{font-size:2rem;letter-spacing:.2em}
.cover .for{font-family:var(--display);text-transform:uppercase;letter-spacing:.2em;font-size:1rem;opacity:.85}
.cover .nm{font-family:var(--display);font-size:clamp(2rem,9vw,3rem);font-weight:700;line-height:1.05}
.cover .se{font-style:italic;font-size:1.05rem;opacity:.9;margin-top:6px}
.cover .ml{font-size:1.3rem;font-weight:600}
.fig{margin:0;display:flex;justify-content:center;background:var(--fig-bg);border-radius:4px;padding:12px}.fig svg{width:150px;height:150px;max-width:100%}
.q{font-size:1.15rem;font-weight:600;line-height:1.35}
.opts{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.opt{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;background:transparent;color:var(--fg);border:2px solid var(--line);border-radius:4px;padding:12px;cursor:pointer}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.95rem;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--sel-bg)}
.opt[aria-pressed="true"] .k{background:var(--blue);border-color:var(--blue);color:var(--blue-fg)}
.opt.ok{border-color:var(--green);background:var(--ok-bg)}
.opt.bad{border-color:var(--red);background:var(--bad-bg)}
.opt.ok .k{background:var(--green);border-color:var(--green);color:var(--surface)}
.opt.bad .k{background:var(--red);border-color:var(--red);color:var(--surface)}
.note{background:var(--sel-bg);border-left:4px solid var(--blue);padding:10px 12px;border-radius:2px;font-size:.95rem}
.nav{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.dot{aspect-ratio:1;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:3px;font-size:.8rem;cursor:pointer;font-variant-numeric:tabular-nums;padding:0}
.dot.done{background:var(--sel-bg);color:var(--fg);border-color:var(--blue)}
.dot.cur{outline:2px solid var(--fg);outline-offset:1px}
.dot.ok{background:var(--ok-bg);border-color:var(--green)}
.dot.bad{background:var(--bad-bg);border-color:var(--red)}
.actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.verdict{font-family:var(--display);font-size:clamp(2.4rem,10vw,3.6rem);font-weight:700;line-height:1;text-transform:uppercase}
.verdict.pass{color:var(--green)} .verdict.fail{color:var(--red)}
.err{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.err p{margin:0}
.tag{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:.85rem;font-weight:700}
.tag.r{color:var(--red)} .tag.g{color:var(--green)}
.fine{color:var(--muted);font-size:.85rem;margin:0}
@media (max-width:420px){.modes{grid-template-columns:1fr}.nav{grid-template-columns:repeat(6,1fr)}}
</style>

<div class="wrap">
  <div class="top">
    <svg class="roundel" width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="20" fill="var(--blue)"/><path d="M12 28 L22 10 L32 28 Z" fill="var(--blue-fg)"/><rect x="13" y="30" width="18" height="3" rx="1" fill="var(--blue-fg)"/></svg>
    <div><div class="eyebrow">Categoria B · Ligeiros</div><h1>Simulador de código</h1></div>

  <div id="app"></div>
  <p class="fine">Prática baseada no Código da Estrada. Não substitui o exame oficial do IMT nem o material da sua escola de condução.</p>
</div>

const BANK=[

};
const $=s=>document.querySelector(s), app=$('#app');
const N=30, MAXERR=3, SECS=30*60;
let S=null, mode='exam', timer=null;
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const L='ABCD';
function best(){try{return JSON.parse(localStorage.getItem('simcod-best')||'null')}catch(e){return null}}
function saveBest(r){try{const b=best();if(!b||r.errs<b.errs)localStorage.setItem('simcod-best',JSON.stringify(r))}catch(e){}}

function home(){
  clearInterval(timer);
  const b=best();
  app.innerHTML=`<div class="cover"><div class="em" aria-hidden="true">🚗 💙 ✨ 🛣️ 🚦</div><div class="for">Para</div><div class="nm">Ludmira Figueiredo</div><div class="ml">Minha vida 💕</div><div class="se">Eu te enxergo</div></div>
  <div class="panel">
    <div class="eyebrow">Folha de exame</div>
    <div class="sheet"><div><b>${N}</b><span>Perguntas</span></div><div><b>30'</b><span>Tempo</span></div><div><b>${MAXERR}</b><span>Erros máx.</span></div></div>
    <p style="margin:0">Cada pergunta tem uma resposta certa. Pergunta sem resposta conta como erro. Com mais de ${MAXERR} erros fica reprovado.</p>
    <div class="modes" role="group" aria-label="Modo">
      <button class="mode" id="m-exam" aria-pressed="${mode==='exam'}"><b>Exame</b><small>Com tempo. A correção só aparece no fim.</small></button>
      <button class="mode" id="m-train" aria-pressed="${mode==='train'}"><b>Treino</b><small>Sem tempo. Vê a correção logo a seguir a cada resposta.</small></button>
    </div>
    <button class="btn" id="go">Começar</button>
    ${b?`<p class="fine">Melhor resultado neste dispositivo: ${b.errs} erro${b.errs===1?'':'s'} (${b.when}).</p>`:''}
  </div>`;
  $('#m-exam').onclick=()=>{mode='exam';home()};
  $('#m-train').onclick=()=>{mode='train';home()};
  $('#go').onclick=start;
}

function start(){
  const qs=sh([...sh(BANK.filter(x=>x[4])).slice(0,9),...sh(BANK.filter(x=>!x[4])).slice(0,N-9)]).map(([q,c,w,e,f])=>{const o=sh([c,...w]);return{q,e,f,opts:o,ans:o.indexOf(c)}});
  S={qs,pick:Array(N).fill(-1),i:0,left:SECS,done:false};
  clearInterval(timer);
  if(mode==='exam'){timer=setInterval(()=>{S.left--;const t=$('#tm');if(t){t.textContent=fmt(S.left);t.classList.toggle('low',S.left<=300)}if(S.left<=0)finish()},1000)}
  quiz();
}

function quiz(){
  const q=S.qs[S.i], tr=mode==='train', p=S.pick[S.i], locked=tr&&p>=0;
  const dots=S.qs.map((_,k)=>{let c='dot';const pk=S.pick[k];if(pk>=0){c+=tr?(pk===S.qs[k].ans?' ok':' bad'):' done'}if(k===S.i)c+=' cur';return`<button class="${c}" data-k="${k}" aria-label="Pergunta ${k+1}">${k+1}</button>`}).join('');
  const opts=q.opts.map((o,k)=>{let c='opt',pr=p===k;if(locked){if(k===q.ans)c+=' ok';else if(pr)c+=' bad'}return`<li><button class="${c}" data-o="${k}" aria-pressed="${pr}" ${locked?'disabled':''}><span class="k">${L[k]}</span><span>${o}</span></button></li>`}).join('');
  const answered=S.pick.filter(x=>x>=0).length;
  app.innerHTML=`<div class="panel">
    <div class="bar"><div class="eyebrow">Pergunta ${S.i+1} de ${N} · ${answered} respondidas</div>${mode==='exam'?`<div class="timer ${S.left<=300?'low':''}" id="tm" aria-label="Tempo restante">${fmt(S.left)}</div>`:''}</div>
    <div class="q">${q.q}</div>${q.f?`<figure class="fig">${FIG[q.f]}</figure>`:''}
    <ul class="opts">${opts}</ul>
    ${locked?`<div class="note"><b>${p===q.ans?'Certo.':'Errado.'}</b> ${q.e}</div>`:''}
    <div class="actions">
      <button class="btn ghost" id="prev" ${S.i===0?'disabled':''}>Anterior</button>
      ${S.i<N-1?`<button class="btn" id="next">Seguinte</button>`:`<button class="btn" id="fin">Terminar</button>`}
    </div>
  </div>
  <div class="panel"><div class="nav">${dots}</div>
    <div class="actions"><button class="btn ghost" id="quit">Sair</button><button class="btn ghost" id="fin2">Terminar exame</button></div></div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.pick[S.i]=+b.dataset.o;quiz()});
  document.querySelectorAll('.dot').forEach(b=>b.onclick=()=>{S.i=+b.dataset.k;quiz()});
  $('#prev').onclick=()=>{S.i--;quiz()};
  if($('#next'))$('#next').onclick=()=>{S.i++;quiz()};
  if($('#fin'))$('#fin').onclick=confirmFinish;
  $('#fin2').onclick=confirmFinish;
  $('#quit').onclick=()=>{clearInterval(timer);home()};
}

function confirmFinish(){
  const blank=S.pick.filter(x=>x<0).length;
  if(!blank)return finish();
  const b=$('#fin2'); if(b.dataset.armed)return finish();
  b.dataset.armed=1;b.textContent=`Faltam ${blank}. Confirmar`;
}

function finish(){
  if(S.done)return;S.done=true;clearInterval(timer);
  const wrong=[];S.qs.forEach((q,k)=>{if(S.pick[k]!==q.ans)wrong.push(k)});
  const errs=wrong.length, pass=errs<=MAXERR, used=SECS-S.left;
  if(mode==='exam')saveBest({errs,when:new Date().toLocaleDateString('pt-PT')});
  const list=wrong.map(k=>{const q=S.qs[k],p=S.pick[k];return`<div class="err"><div class="tag r">Pergunta ${k+1}</div><p><b>${q.q}</b></p>${q.f?`<figure class="fig">${FIG[q.f]}</figure>`:''}
    <p><span class="tag r">${p<0?'Sem resposta':'A sua resposta'}</span>${p<0?'':' · '+q.opts[p]}</p><p><span class="tag g">Correta</span> · ${q.opts[q.ans]}</p><p class="fine">${q.e}</p></div>`}).join('');
  app.innerHTML=`<div class="panel">
    <div class="eyebrow">Resultado</div>
    <div class="verdict ${pass?'pass':'fail'}">${pass?'Aprovado':'Reprovado'}</div>
    <div class="sheet"><div><b>${N-errs}</b><span>Certas</span></div><div><b>${errs}</b><span>Erros</span></div><div><b>${mode==='exam'?fmt(used):'—'}</b><span>Tempo</span></div></div>
    <p style="margin:0">${pass?`Ficou dentro do limite de ${MAXERR} erros.`:`O limite é ${MAXERR} erros. Reveja as respostas abaixo e tente outra vez.`}</p>
    <div class="actions"><button class="btn" id="again">Novo exame</button><button class="btn ghost" id="menu">Início</button></div>
  </div>
  ${errs?`<div class="panel"><h2>Para rever</h2>${list}</div>`:''}`;
  $('#again').onclick=start;$('#menu').onclick=home;
  window.scrollTo(0,0);
}
home();
</script>
